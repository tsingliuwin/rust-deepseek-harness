[workspace]
resolver = "3"
members = [
  "crates/cordis",
  "crates/dsh-llm",
  "crates/dsh-llm-deepseek",
  "crates/dsh-session",
  "crates/dsh-session-projection",
  "crates/dsh-tools",
  "crates/dsh-system-prompt",
  "crates/dsh-agent",
  "crates/dsh-agent-loop",
  "crates/dsh-gpui",
  "crates/dsh-fs",
  "crates/dsh-shell",
  "crates/dsh-web",
  "crates/dsh-search",
  "crates/dsh-compaction",
  "crates/dsh-subagent",
  "crates/dsh-persist",
]

# vendor 补丁版：markdown 渲染排版对齐 web（li 6px 间距、圆点次级色 marker、
# strong 600、标题边距/字重/行高、hr、blockquote），改动见 vendor/gpui-component
# 内 [dsh] 注释。
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
bytes = "1"
async-stream = "0.3"
flume = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "stream", "json", "gzip", "brotli", "deflate"] }
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
encoding_rs = "0.8"
codepage = "0.1"